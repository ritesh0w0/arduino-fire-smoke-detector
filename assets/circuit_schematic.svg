<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 680" width="100%" height="100%" style="background-color: #0d1117; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif;">
  <defs>
    <style>
      .chip-bg { fill: #161b22; stroke: #30363d; stroke-width: 2; rx: 8; }
      .header-bg { fill: #21262d; rx: 6; }
      .label-title { fill: #58a6ff; font-weight: 700; font-size: 15px; }
      .label-sub { fill: #8b949e; font-size: 12px; }
      .pin-name { fill: #e6edf3; font-size: 11px; font-family: monospace; }
      .pin-dot { r: 4; }
      .wire { fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
      .wire-5v { stroke: #f85149; }
      .wire-gnd { stroke: #6e7681; stroke-dasharray: 4, 3; }
      .wire-dht { stroke: #3fb950; }
      .wire-mq3 { stroke: #d29922; }
      .wire-buzz { stroke: #f0883e; }
      .wire-lcd { stroke: #a371f7; }
      .card-title { fill: #ffffff; font-weight: 600; font-size: 14px; }
    </style>
  </defs>

  <!-- Title Banner -->
  <rect x="20" y="15" width="960" height="50" rx="8" fill="#161b22" stroke="#30363d" stroke-width="1.5"/>
  <text x="40" y="45" fill="#f0f6fc" font-size="18" font-weight="700">Hardware Circuit Schematic — Smoke and Fire Detection Alarm System</text>
  <text x="820" y="45" fill="#8b949e" font-size="13">Arduino Uno R3</text>

  <!-- 1. ARDUINO UNO R3 BOX -->
  <g id="arduino" transform="translate(360, 150)">
    <rect width="280" height="380" class="chip-bg" stroke="#58a6ff" stroke-width="2"/>
    <rect x="10" y="10" width="260" height="36" class="header-bg"/>
    <text x="140" y="34" fill="#58a6ff" font-weight="bold" font-size="16" text-anchor="middle">ARDUINO UNO R3</text>

    <!-- Digital Header (Left/Top side pins) -->
    <text x="250" y="70" class="pin-name" text-anchor="end">D12 (LCD RS)</text>
    <circle cx="265" cy="67" class="pin-dot" fill="#a371f7"/>
    <text x="250" y="95" class="pin-name" text-anchor="end">D11 (LCD EN)</text>
    <circle cx="265" cy="92" class="pin-dot" fill="#a371f7"/>
    <text x="250" y="120" class="pin-name" text-anchor="end">D8 (Buzzer)</text>
    <circle cx="265" cy="117" class="pin-dot" fill="#f0883e"/>
    <text x="250" y="145" class="pin-name" text-anchor="end">D7 (LCD D4)</text>
    <circle cx="265" cy="142" class="pin-dot" fill="#a371f7"/>
    <text x="250" y="170" class="pin-name" text-anchor="end">D6 (LCD D5)</text>
    <circle cx="265" cy="167" class="pin-dot" fill="#a371f7"/>
    <text x="250" y="195" class="pin-name" text-anchor="end">D5 (LCD D6)</text>
    <circle cx="265" cy="192" class="pin-dot" fill="#a371f7"/>
    <text x="250" y="220" class="pin-name" text-anchor="end">D4 (LCD D7)</text>
    <circle cx="265" cy="217" class="pin-dot" fill="#a371f7"/>
    <text x="250" y="245" class="pin-name" text-anchor="end">D2 (DHT11 Data)</text>
    <circle cx="265" cy="242" class="pin-dot" fill="#3fb950"/>

    <!-- Power / Analog Header -->
    <circle cx="15" cy="290" class="pin-dot" fill="#f85149"/>
    <text x="28" y="293" class="pin-name">5V Power Rail</text>
    <circle cx="15" cy="315" class="pin-dot" fill="#6e7681"/>
    <text x="28" y="318" class="pin-name">GND (Common)</text>
    <circle cx="15" cy="345" class="pin-dot" fill="#d29922"/>
    <text x="28" y="348" class="pin-name">A0 (MQ-3 Analog)</text>

    <!-- Microcontroller Chip Symbol in Center -->
    <rect x="70" y="120" width="100" height="130" rx="4" fill="#0d1117" stroke="#30363d" stroke-width="1.5"/>
    <text x="120" y="180" fill="#8b949e" font-size="12" text-anchor="middle">ATmega328P</text>
    <text x="120" y="198" fill="#484f58" font-size="10" text-anchor="middle">16 MHz</text>
  </g>

  <!-- 2. SENSORS (LEFT SIDE) -->
  <!-- MQ-3 Gas / Smoke Sensor -->
  <g id="mq3" transform="translate(40, 100)">
    <rect width="220" height="130" class="chip-bg" stroke="#d29922"/>
    <rect x="8" y="8" width="204" height="28" class="header-bg"/>
    <text x="110" y="27" fill="#d29922" font-weight="bold" font-size="13" text-anchor="middle">MQ-3 Gas Sensor</text>
    <text x="25" y="60" class="pin-name">VCC → 5V</text>
    <circle cx="195" cy="56" class="pin-dot" fill="#f85149"/>
    <text x="25" y="85" class="pin-name">GND → GND</text>
    <circle cx="195" cy="82" class="pin-dot" fill="#6e7681"/>
    <text x="25" y="110" class="pin-name">A0 (Analog Out)</text>
    <circle cx="195" cy="107" class="pin-dot" fill="#d29922"/>
  </g>

  <!-- DHT11 Temperature & Humidity Sensor -->
  <g id="dht11" transform="translate(40, 270)">
    <rect width="220" height="130" class="chip-bg" stroke="#3fb950"/>
    <rect x="8" y="8" width="204" height="28" class="header-bg"/>
    <text x="110" y="27" fill="#3fb950" font-weight="bold" font-size="13" text-anchor="middle">DHT11 Temp &amp; Humidity</text>
    <text x="25" y="60" class="pin-name">VCC → 5V</text>
    <circle cx="195" cy="56" class="pin-dot" fill="#f85149"/>
    <text x="25" y="85" class="pin-name">DATA → D2</text>
    <circle cx="195" cy="82" class="pin-dot" fill="#3fb950"/>
    <text x="25" y="110" class="pin-name">GND → GND</text>
    <circle cx="195" cy="107" class="pin-dot" fill="#6e7681"/>
  </g>

  <!-- Piezo Buzzer -->
  <g id="buzzer" transform="translate(40, 440)">
    <rect width="220" height="110" class="chip-bg" stroke="#f0883e"/>
    <rect x="8" y="8" width="204" height="28" class="header-bg"/>
    <text x="110" y="27" fill="#f0883e" font-weight="bold" font-size="13" text-anchor="middle">Piezo Buzzer (Alarm)</text>
    <text x="25" y="62" class="pin-name">(+) Anode → D8</text>
    <circle cx="195" cy="58" class="pin-dot" fill="#f0883e"/>
    <text x="25" y="90" class="pin-name">(-) Cathode → GND</text>
    <circle cx="195" cy="86" class="pin-dot" fill="#6e7681"/>
  </g>

  <!-- 3. OUTPUT ACTUATORS (RIGHT SIDE) -->
  <!-- 16x2 Character LCD Display -->
  <g id="lcd" transform="translate(730, 100)">
    <rect width="230" height="470" class="chip-bg" stroke="#a371f7"/>
    <rect x="8" y="8" width="214" height="28" class="header-bg"/>
    <text x="115" y="27" fill="#a371f7" font-weight="bold" font-size="13" text-anchor="middle">16x2 LCD (HD44780)</text>
    <rect x="15" y="44" width="200" height="44" rx="4" fill="#1b4b27" stroke="#3fb950" stroke-width="1"/>
    <text x="25" y="62" fill="#7ee787" font-family="monospace" font-size="10">T:28.9C  H:65%</text>
    <text x="25" y="78" fill="#7ee787" font-family="monospace" font-size="10">Gas:126  [SAFE]</text>

    <!-- Pins -->
    <circle cx="20" cy="115" class="pin-dot" fill="#6e7681"/>
    <text x="32" y="118" class="pin-name">Pin 1: VSS (GND)</text>
    <circle cx="20" cy="140" class="pin-dot" fill="#f85149"/>
    <text x="32" y="143" class="pin-name">Pin 2: VDD (5V)</text>
    <circle cx="20" cy="165" class="pin-dot" fill="#e3b341"/>
    <text x="32" y="168" class="pin-name">Pin 3: VO (Contrast ~1kΩ)</text>
    <circle cx="20" cy="195" class="pin-dot" fill="#a371f7"/>
    <text x="32" y="198" class="pin-name">Pin 4: RS → Arduino D12</text>
    <circle cx="20" cy="220" class="pin-dot" fill="#6e7681"/>
    <text x="32" y="223" class="pin-name">Pin 5: RW → GND</text>
    <circle cx="20" cy="245" class="pin-dot" fill="#a371f7"/>
    <text x="32" y="248" class="pin-name">Pin 6: EN → Arduino D11</text>
    <circle cx="20" cy="285" class="pin-dot" fill="#a371f7"/>
    <text x="32" y="288" class="pin-name">Pin 11: D4 → Arduino D7</text>
    <circle cx="20" cy="310" class="pin-dot" fill="#a371f7"/>
    <text x="32" y="313" class="pin-name">Pin 12: D5 → Arduino D6</text>
    <circle cx="20" cy="335" class="pin-dot" fill="#a371f7"/>
    <text x="32" y="338" class="pin-name">Pin 13: D6 → Arduino D5</text>
    <circle cx="20" cy="360" class="pin-dot" fill="#a371f7"/>
    <text x="32" y="363" class="pin-name">Pin 14: D7 → Arduino D4</text>
    <circle cx="20" cy="400" class="pin-dot" fill="#f85149"/>
    <text x="32" y="403" class="pin-name">Pin 15: A (Backlight +5V)</text>
    <circle cx="20" cy="425" class="pin-dot" fill="#6e7681"/>
    <text x="32" y="428" class="pin-name">Pin 16: K (Backlight GND)</text>
  </g>

  <!-- WIRING BUS / CONNECTIONS -->
  <!-- MQ-3 AO -> Arduino A0 -->
  <path d="M 235 207 L 310 207 L 310 495 L 375 495" class="wire wire-mq3"/>

  <!-- DHT11 DATA -> D2 -->
  <path d="M 235 352 L 290 352 L 290 392 L 625 392" class="wire wire-dht"/>

  <!-- Buzzer (+) -> Arduino D8 -->
  <path d="M 235 498 L 270 498 L 270 267 L 625 267" class="wire wire-buzz"/>

  <!-- LCD Control Wires -->
  <!-- RS: Pin 4 (y=295) -> D12 (y=217) -->
  <path d="M 750 295 L 685 295 L 685 217 L 625 217" class="wire wire-lcd"/>
  <!-- EN: Pin 6 (y=345) -> D11 (y=242) -->
  <path d="M 750 345 L 675 345 L 675 242 L 625 242" class="wire wire-lcd"/>
  <!-- D4: Pin 11 (y=385) -> D7 (y=292) -->
  <path d="M 750 385 L 665 385 L 665 292 L 625 292" class="wire wire-lcd"/>
  <!-- D5: Pin 12 (y=410) -> D6 (y=317) -->
  <path d="M 750 410 L 655 410 L 655 317 L 625 317" class="wire wire-lcd"/>
  <!-- D6: Pin 13 (y=435) -> D5 (y=342) -->
  <path d="M 750 435 L 645 435 L 645 342 L 625 342" class="wire wire-lcd"/>
  <!-- D7: Pin 14 (y=460) -> D4 (y=367) -->
  <path d="M 750 460 L 635 460 L 635 367 L 625 367" class="wire wire-lcd"/>

  <!-- Bottom Legend Bar -->
  <g transform="translate(140, 615)">
    <rect width="720" height="42" rx="6" fill="#161b22" stroke="#30363d"/>
    <circle cx="30" cy="21" r="5" fill="#f85149"/>
    <text x="42" y="25" fill="#c9d1d9" font-size="12">5V Power</text>
    <circle cx="130" cy="21" r="5" fill="#6e7681"/>
    <text x="142" y="25" fill="#c9d1d9" font-size="12">Ground (GND)</text>
    <circle cx="260" cy="21" r="5" fill="#3fb950"/>
    <text x="272" y="25" fill="#c9d1d9" font-size="12">DHT11 Data</text>
    <circle cx="380" cy="21" r="5" fill="#d29922"/>
    <text x="392" y="25" fill="#c9d1d9" font-size="12">MQ-3 Analog</text>
    <circle cx="500" cy="21" r="5" fill="#f0883e"/>
    <text x="512" y="25" fill="#c9d1d9" font-size="12">Buzzer Alert</text>
    <circle cx="610" cy="21" r="5" fill="#a371f7"/>
    <text x="622" y="25" fill="#c9d1d9" font-size="12">LCD Bus</text>
  </g>
</svg>